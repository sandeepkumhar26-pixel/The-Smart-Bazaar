{% extends "navbar.html" %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
  body {
    background: #f3f3f3;
  }

  .checkout-card {
    border-radius: 10px;
  }

  .sec-title {
    font-weight: 600;
    border-bottom: 1px solid #ddd;
    padding-bottom: 8px;
    margin-bottom: 15px;
  }

  .error {
    font-size: 12px;
    color: red;
  }
</style>

<form id="checkout-form" method="POST" action="/place_order">
  <div class="container my-4">
    <div class="row g-4">

      <div class="col-md-8">

        <div class="card checkout-card p-3 mb-3">
          <h5 class="sec-title">1️⃣ Delivery Address</h5>

          <input id="name" name="name" class="form-control mb-1" placeholder="Full Name">
          <div id="err_name" class="error"></div>

          <input id="mobile" name="mobile" class="form-control mb-1" placeholder="Mobile Number" maxlength="10">
          <div id="err_mobile" class="error"></div>

          <input id="email" class="form-control mb-1" placeholder="Email">
          <div id="err_email" class="error"></div>

          <textarea id="address" name="address" class="form-control mb-1" placeholder="Full Address"></textarea>
          <div id="err_address" class="error"></div>

          <select id="state" class="form-control mb-1">
            <option value="">Select State</option>
            <option>Maharashtra</option>
            <option>Gujarat</option>
            <option>Delhi</option>
          </select>
          <div id="err_state" class="error"></div>

          <select id="city" class="form-control mb-1">
            <option value="">Select City</option>
          </select>
          <div id="err_city" class="error"></div>

          <input id="pincode" class="form-control mb-1" placeholder="Pincode" maxlength="6">
          <div id="err_pincode" class="error"></div>
          <input type="hidden" name="payment" value="Online Payment">
        </div>

        <div class="card checkout-card p-3">
          <h5 class="sec-title">2️⃣ Billing Address</h5>

          <div class="form-check mb-2">
            <input type="checkbox" id="sameAddress" class="form-check-input">
            <label class="form-check-label">Same as Delivery Address</label>
          </div>

          <input id="b_name" class="form-control mb-2" placeholder="Full Name">
          <input id="b_mobile" class="form-control mb-2" placeholder="Mobile">
          <input id="b_email" class="form-control mb-2" placeholder="Email">
          <textarea id="b_address" class="form-control mb-2" placeholder="Full Address"></textarea>

          <select id="b_state" class="form-control mb-2">
            <option value="">Select State</option>
            <option>Maharashtra</option>
            <option>Gujarat</option>
            <option>Delhi</option>
          </select>

          <select id="b_city" class="form-control mb-2">
            <option value="">Select City</option>
          </select>

          <input id="b_pincode" class="form-control mb-2" placeholder="Pincode">

        </div>

      </div>

      <div class="col-md-4">
        <div class="card checkout-card p-3">

          <h5 class="sec-title">Order Summary</h5>

          {% for p in products %}
          <div class="text-center mb-3">
            <img src="{{ url_for('static', filename='uploads/' + p.image) }}" style="height:200px; width:200px;"
              class="mb-2">
            <h6>{{ p.name }}</h6>
          </div>
          {% endfor %}

          <hr>

          <p class="d-flex justify-content-between">
            <span>Subtotal</span>
            <span>₹{{ total }}</span>
          </p>

          <p class="d-flex justify-content-between">
            <span>Delivery Charges</span>
            <span>₹50</span>
          </p>

          <hr>

          <p class="d-flex justify-content-between fw-bold">
            <span>Grand Total</span>
            <span id="grandTotal">₹{{ total + 50 }}</span>
          </p>

          <button type="submit" class="btn btn-success w-100">
            Place Order
          </button>

        </div>
      </div>

    </div>
  </div>
</form>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    // ===== ELEMENTS =====
    const state = document.getElementById("state");
    const city = document.getElementById("city");
    const b_state = document.getElementById("b_state");
    const b_city = document.getElementById("b_city");
    const sameAddress = document.getElementById("sameAddress");

    // ===== STATE CITY =====
    const data = {
      "Maharashtra": ["Mumbai", "Pune"],
      "Gujarat": ["Ahmedabad", "Surat"],
      "Delhi": ["New Delhi"]
    };

    state.addEventListener("change", function () {
      city.innerHTML = "<option value=''>Select City</option>";
      (data[this.value] || []).forEach(c => {
        city.innerHTML += `<option>${c}</option>`;
      });
    });

    b_state.addEventListener("change", function () {
      b_city.innerHTML = "<option value=''>Select City</option>";
      (data[this.value] || []).forEach(c => {
        b_city.innerHTML += `<option>${c}</option>`;
      });
    });

    // ===== SAME ADDRESS =====
    sameAddress.addEventListener("change", function () {
      if (this.checked) {
        document.getElementById("b_name").value = document.getElementById("name").value;
        document.getElementById("b_mobile").value = document.getElementById("mobile").value;
        document.getElementById("b_email").value = document.getElementById("email").value;
        document.getElementById("b_address").value = document.getElementById("address").value;

        b_state.value = state.value;
        b_state.dispatchEvent(new Event("change"));

        setTimeout(() => b_city.value = city.value, 200);

        document.getElementById("b_pincode").value = document.getElementById("pincode").value;
      }
    });

    // ===== SUBMIT + VALIDATION + PAYMENT =====
    document.getElementById("checkout-form").addEventListener("submit", function (e) {

      e.preventDefault();

      let valid = true;

      let name = document.getElementById("name").value.trim();
      let mobile = document.getElementById("mobile").value.trim();
      let email = document.getElementById("email").value.trim();
      let address = document.getElementById("address").value.trim();
      let stateV = document.getElementById("state").value;
      let cityV = document.getElementById("city").value;
      let pin = document.getElementById("pincode").value.trim();

      document.querySelectorAll(".error").forEach(e => e.innerHTML = "");

      if (name === "") { err_name.innerHTML = "Enter name"; valid = false; }
      if (mobile.length != 10) { err_mobile.innerHTML = "Enter valid mobile"; valid = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err_email.innerHTML = "Enter valid email"; valid = false; }
      if (address === "") { err_address.innerHTML = "Enter address"; valid = false; }
      if (stateV === "") { err_state.innerHTML = "Select state"; valid = false; }
      if (cityV === "") { err_city.innerHTML = "Select city"; valid = false; }
      if (pin.length != 6) { err_pincode.innerHTML = "Enter valid pincode"; valid = false; }

      if (!valid) return;

      let amount = document.getElementById("grandTotal").innerText.replace("₹", "");

      fetch("/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: amount })
      })
        .then(res => res.json())
        .then(order => {

          var options = {
            key: "rzp_test_Sk8VXld7HBr552",
            amount: order.amount,
            currency: "INR",
            name: "The Smart Bazaar",
            order_id: order.id,

            handler: function (response) {
              fetch("/verify-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(response)
              })
                .then(res => res.json())
                .then(data => {
                  if (data.status === "success") {
                    document.getElementById("checkout-form").submit();
                  } else {
                    alert("Payment Failed");
                  }
                });
            }
          };

          new Razorpay(options).open();

        });

    });

  });
</script>

{% include "footer.html" %}
{% endblock %}
