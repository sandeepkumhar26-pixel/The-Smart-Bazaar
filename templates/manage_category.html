{% extends "admin_layout.html" %}
{% block content %}

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Category List</h2>

    <a href="/add-category" class="btn btn-primary">
      + Add Category
    </a>
  </div>

  <div class="card p-4 shadow-sm">

    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Image</th>
          <th width="180">Action</th>
        </tr>
      </thead>

      <tbody>
        {% for c in category_data %}
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.name }}</td>

          <td>
            <img src="{{ url_for('static', filename='uploads/' + c.image) }}"
                 height="50">
          </td>

          <td>
            <a href="/edit_category/{{ c.id }}" class="btn btn-warning btn-sm">Edit</a>
            <a href="/delete-category/{{ c.id }}" class="btn btn-danger btn-sm">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>

    </table>

  </div>
</div>

{% endblock %}
