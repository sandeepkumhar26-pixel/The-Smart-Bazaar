<!DOCTYPE html>
<html>
<head>
<title>Logging Out...</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg, #2874f0, #5f9cff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

.card-box{
    background:#fff;
    color:#333;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:400px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.spinner{
    width:60px;
    height:60px;
    border:6px solid #eee;
    border-top:6px solid #2874f0;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    100%{ transform:rotate(360deg); }
}
</style>

<script>
setTimeout(function(){
    window.location.href="/login";
},3000);
</script>

</head>

<body>

<div class="card-box">

    <div class="spinner mb-4"></div>

    <h4>Logging you out...</h4>
    <p class="text-muted">Please wait while we securely log you out.</p>

    <a href="/login" class="btn btn-primary mt-3">Go to Login</a>

</div>

</body>
</html>
