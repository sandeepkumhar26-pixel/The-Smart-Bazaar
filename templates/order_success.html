<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Placed | The Smart Bazaar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background: #f3f3f3; }
    .success-card {
      max-width: 600px;
      margin: auto;
      margin-top: 80px;
      border-radius: 12px;
    }
    .success-icon {
      font-size: 70px;
      color: #28a745;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card success-card shadow text-center p-4">
    
    <div class="success-icon mb-3">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h3 class="fw-bold text-success">Order Placed Successfully</h3>
    <p class="text-muted mt-2">
      Thank you for shopping with <b>The Smart Bazaar</b>
    </p>

    <hr>

    <!-- ✅ ORDER ID -->
    <p class="fw-bold">Order ID: {{ order_id }}</p>

    <!-- ✅ PRODUCT NAMES -->
<div>
  {% for p in products %}
    <div class="mb-2">
      <strong>{{ p.name }}</strong>
    </div>
  {% endfor %}
</div>
    <!-- ✅ TOTAL FIX -->
    <h6 class="fw-bold text-primary">
      Total Paid: ₹{{ total }}
    </h6>

    <p class="mt-3 small text-muted">
      Your order will be delivered within 3–5 business days.
    </p>

    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="/" class="btn btn-outline-primary">
        Continue Shopping
      </a>
      <a href="/orders" class="btn btn-primary">
        View Orders
      </a>
    </div>

  </div>
</div>

</body>
</html>
