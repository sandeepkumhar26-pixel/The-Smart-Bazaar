<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Smart Bazaar{% endblock %}</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">

  <div class="container-fluid px-4">

    <!-- LOGO -->
    <a class="navbar-brand fw-bold fs-5 fs-lg-3 text-nowrap" href="/">
      The Smart Bazaar
    </a>

    <!-- SEARCH (always visible, even on mobile) -->
    <form action="/search"
          method="GET"
          class="d-flex flex-grow-1 mx-2 mx-lg-4"
          style="max-width:500px;">

      <input
        type="text"
        name="q"
        class="form-control rounded-start-pill border-0 shadow-sm"
        placeholder="Search for products, brands and more..."
        style="height:45px;">

      <button
        class="btn btn-warning rounded-end-pill px-3 fw-bold"
        type="submit">

        <i class="bi bi-search"></i>

      </button>

    </form>

    <!-- MOBILE TOGGLE -->
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav">

      <span class="navbar-toggler-icon"></span>

    </button>

    <!-- NAVBAR -->
    <div class="collapse navbar-collapse" id="nav">

      <!-- NAV LINKS -->
      <ul class="navbar-nav align-items-lg-center ms-auto gap-lg-2">

        <li class="nav-item">
          <a class="nav-link active fw-semibold" href="/">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="/aboutus">
            About
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="/contactus">
            Contact
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="/shop">
            Products
          </a>
        </li>

        <!-- LOGIN LOGOUT -->
        {% if session.get('user') %}

        <li class="nav-item">
          <a href="/logout"
             class="nav-link text-warning fw-semibold">

            Logout

          </a>
        </li>

        {% else %}

        <li class="nav-item">
          <a href="/login"
             class="nav-link fw-semibold">

            Login

          </a>
        </li>

        {% endif %}

        <!-- WISHLIST -->
        <li class="nav-item">

          <a href="/wishlist"
             class="btn btn-light position-relative fw-semibold">

            ❤️ Wishlist

          </a>

        </li>

        <!-- CART -->
        <li class="nav-item">

          <a href="/cart"
             class="btn btn-outline-light fw-semibold">

            🛒 Cart

          </a>

        </li>

        <!-- ORDERS -->
        <li class="nav-item">

          <a href="/orders"
             class="btn btn-outline-light fw-semibold">

            My Orders

          </a>

        </li>

      </ul>

    </div>

  </div>

</nav>
{% block content %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
