<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }
        .card{
            border-radius:15px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">
        <h3 class="mb-4 text-center">✏️ Edit Category</h3>

        <form method="POST">

            <!-- ID (hidden) -->
            <input type="hidden" name="id" value="{{ category.id }}">

            <!-- Category Name -->
            <div class="mb-3">
                <label class="form-label">Category Name</label>
                <input type="text"
                       name="name"
                       value="{{ category.name }}"
                       class="form-control"
                       required>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/manage-category" class="btn btn-secondary">
                    ← Back
                </a>

                <button type="submit" class="btn btn-success">
                    Update Category
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
