<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You | Feedback Submitted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .thank-card {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    .check-icon {
      font-size: 60px;
      color: #28a745;
    }
    .btn-home {
      background: #0d6efd;
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      text-decoration: none;
    }
    .btn-home:hover {
      background: #0b5ed7;
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="thank-card">
    <div class="check-icon">✔</div>

    <h3 class="mt-3 fw-bold">Thank You!</h3>

    <p class="text-muted mt-2">
      Your feedback has been successfully submitted.  
      We appreciate you taking the time to share your thoughts with us.
    </p>

    <a href="/" class="btn btn-home mt-3">Go Back to Home</a>
  </div>

</body>
</html>
