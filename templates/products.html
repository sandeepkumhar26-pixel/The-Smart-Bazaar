{% extends "navbar.html" %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f1f3f6;
}
.title{
    text-align:center;
    font-size:28px;
    font-weight:600;
    margin:20px 0;
}
.product-card{
    background:#fff;
    border-radius:10px;
    padding:15px;
    text-align:center;
    transition:0.3s;
    border:1px solid #ddd;
}
.product-card:hover{
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    transform:translateY(-5px);
}
.product-img{
    height:220px;
    object-fit:contain;
}
.product-name{
    font-size:18px;
    font-weight:500;
}
.product-desc{
    font-size:14px;
    color:#666;
}
.product-price{
    color:#008000;
    font-weight:bold;
    font-size:18px;
    margin-bottom:10px;
}
.btn-cart{
    width:100%;
    background:#2874f0;
    color:white;
    border:none;
    padding:8px;
    border-radius:5px;
    margin-bottom:8px;
}
.btn-buy{
    width:100%;
    background:#218838;
    color:white;
    border:none;
    padding:8px;
    border-radius:5px;
}
</style>
  <!-- RIGHT FILTER -->
        <form method="GET" action="/filter/{{ cat_id }}">

            <div class="d-flex gap-2 flex-wrap">

                <select
                name="sort"
                onchange="this.form.submit()"
                class="form-select shadow-sm"
                style="
                    width:220px;
                    height:45px;
                    border-radius:10px;
                    font-weight:500;
                    margin-top: 1%;
                ">

                    <option value="">
                        Sort By
                    </option>

                    <option value="low-high">
                        Price -- Low to High
                    </option>

                    <option value="high-low">
                        Price -- High to Low
                    </option>

                    <option value="a-z">
                        Name -- A to Z
                    </option>

                    <option value="z-a">
                        Name -- Z to A
                    </option>

                </select>

            </div>

        </form>

    </div>

</div>

<div class="container">

    <div class="title"></div>

    <div class="row">
        {% for p in products %}
        <div class="col-md-3 mb-4">

            <div class="product-card">

                <!-- ✅ FIXED IMAGE -->
               <!-- CLICKABLE START -->
    <a href="/product/{{ p.id }}" style="text-decoration:none; color:black; display:block;">

        <img src="{{ url_for('static', filename='uploads/' + p.image) }}" 
             class="product-img img-fluid"
             onerror="this.style.display='none'">

        <div class="product-name">{{ p.name }}</div>

        <div class="product-desc">
            {{ p.description if p.description else "Best quality product" }}
        </div>

        <div class="product-price">₹{{ p.price }}</div>

    </a>
        
                <!-- ✅ FIXED ID (no quotes needed) -->
                <button onclick="addToCart({{ p.id }})" class="btn-cart">
                    Add to Cart
                </button>

                 <a href="/buy-now/{{ p.id }}" class="btn-buy d-block" style="text-decoration:none;">
        Buy Now
    </a>

            </div>

        </div>
        {% endfor %}
    </div>

</div>

<!-- TOAST -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
  <div id="cartToast" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body">
        ✅ Product added to cart
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function addToCart(pid){
    fetch("/add-to-cart/" + pid)
    .then(res => res.json())
    .then(data => {

        if(data.status === "login_required"){
            window.location.href = "/login";
        } else {
            let toast = new bootstrap.Toast(document.getElementById('cartToast'));
            toast.show();
        }

    });
}
</script>
{% include "footer.html" %}
{% endblock %}
