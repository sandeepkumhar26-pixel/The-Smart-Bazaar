{% extends "adminmaster.html" %}
{% block content %}
<section>
    <div class="container">
        <div class="text-center">
            <h1>Category List</h1>
        </div>
        <div class="mb-5">
            <a href="/manage-category?id=-1" class="btn btn-success">Add New Category</a>
        </div>
        <table class="table table-bordered">
            <tr>
                <td>
                    Id
                </td>
                <td>
                    Name
                </td>
                <td>
                    Action
                </td>
            </tr>
            {% for i in data %}
            <tr>
                <td>
                    {{i.id}}
                </td>
                <td>
                    {{i.name}}
                </td>
                <td>
                    <a href="/manage-category?id={{i.id}}" class="btn btn-success">Edit</a>
                    &nbsp;&nbsp;&nbsp;
                    <a href="/delete-category?id={{i.id}}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</section>
{% endblock %}
