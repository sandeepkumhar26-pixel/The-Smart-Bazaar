{% extends "masterpage.html" %}
{% block content %}

<!-- Hero Section -->
<section class="hero text-center">
    <div class="container">
        <h1 class="display-4 fw-bold">Welcome to MyStore</h1>
        <p class="lead mt-3">Discover top categories and latest deals on your favorite products.</p>
        <a href="#" class="btn btn-light btn-lg mt-2">Shop Now</a>
    </div>
</section>

<!-- Category Section -->
<div class="container py-5">
    <h2 class="text-center fw-bold mb-4">Top Categories</h2>
    <div class="row justify-content-center">
        <div class="col-md-4 mb-3">
            <div class="card category-card p-3 text-center">
                <h4>Electronics</h4>
                <p>Mobiles, Laptops, Cameras & more</p>
                <button class="btn btn-primary">Explore</button>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card category-card p-3 text-center">
                <h4>Fashion</h4>
                <p>Men, Women & Kids Collection</p>
                <button class="btn btn-primary">Explore</button>
            </div>
        </div>
    </div>
